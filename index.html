<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Wants to Be a Millionaire - Programming Edition</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(circle, #173d91, #061238 70%);
}

.game {
  max-width: 1200px;
  min-height: 100vh;
  margin: auto;
  padding: 18px;
}

.logo {
  width: 180px;
  height: 180px;
  margin: 0 auto 8px;
  border: 6px solid #ffd700;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: #ffd700;
  font-size: 18px;
  font-weight: bold;
  line-height: 1.15;
  text-shadow: 0 0 8px #ffd700;
  box-shadow: 0 0 25px #ffd700, inset 0 0 20px #071642;
  background: radial-gradient(circle, #245ac3, #071642);
}

.logo small {
  margin-top: 8px;
  color: white;
  font-size: 12px;
  letter-spacing: 2px;
}

h1 {
  margin: 5px 0 18px;
  color: #ffd700;
  text-align: center;
  font-size: clamp(24px, 4vw, 42px);
  text-shadow: 0 0 10px #ffd700;
}

.main {
  display: grid;
  grid-template-columns: 1fr 235px;
  gap: 20px;
}

.left {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.question-number {
  margin: 8px;
  color: #ffd700;
  font-size: 19px;
  font-weight: bold;
  text-align: center;
}

.question {
  width: 100%;
  min-height: 105px;
  padding: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: clamp(19px, 3vw, 28px);
  font-weight: bold;
  border: 3px solid #ffd700;
  border-radius: 18px;
  background: linear-gradient(#174394, #081a52);
}

.answers {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 18px;
}

.answer {
  min-height: 68px;
  padding: 12px;
  border: 2px solid #8eb4ff;
  border-radius: 13px;
  color: white;
  background: linear-gradient(#174394, #081a52);
  font-size: 17px;
  cursor: pointer;
}

.answer:hover:not(:disabled) {
  border-color: #ffd700;
  background: #2b62c9;
}

.answer.correct {
  background: #16843c;
  border-color: #5cff91;
}

.answer.wrong {
  background: #a51d2d;
  border-color: #ff7180;
}

.answer:disabled {
  cursor: default;
}

.lifelines {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 22px;
}

.lifeline,
.start-button,
.restart-button {
  padding: 12px 17px;
  border: 2px solid #ffd700;
  border-radius: 24px;
  color: white;
  background: #102d76;
  font-weight: bold;
  cursor: pointer;
}

.lifeline:hover:not(:disabled) {
  background: #2b62c9;
}

.lifeline:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.message {
  min-height: 32px;
  margin-top: 16px;
  color: #ffd700;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
}

.money-ladder {
  height: fit-content;
  padding: 14px;
  border: 2px solid #ffd700;
  border-radius: 15px;
  background: rgba(0, 0, 0, 0.35);
}

.money-ladder h2 {
  margin: 0 0 10px;
  color: #ffd700;
  text-align: center;
  font-size: 21px;
}

.prize {
  padding: 6px 10px;
  border-radius: 7px;
  color: #ffd700;
  font-weight: bold;
}

.prize.current {
  color: white;
  background: #c78300;
}

.prize.safe {
  color: white;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 5, 25, 0.95);
}

.box {
  width: 100%;
  max-width: 580px;
  padding: 32px;
  border: 3px solid #ffd700;
  border-radius: 20px;
  background: linear-gradient(#174394, #081a52);
  text-align: center;
  box-shadow: 0 0 30px #ffd700;
}

.box h2 {
  margin-top: 0;
  color: #ffd700;
  font-size: 31px;
}

.box p {
  font-size: 18px;
  line-height: 1.5;
}

.start-button,
.restart-button {
  color: #071238;
  background: #ffd700;
  font-size: 18px;
}

.hidden {
  display: none;
}

@media (max-width: 800px) {
  .main {
    grid-template-columns: 1fr;
  }

  .money-ladder {
    order: -1;
  }
}

@media (max-width: 550px) {
  .answers {
    grid-template-columns: 1fr;
  }

  .logo {
    width: 145px;
    height: 145px;
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div class="game">
  <div class="logo">
    WHO WANTS<br>
    TO BE A<br>
    MILLIONAIRE?
    <small>PROGRAMMING EDITION</small>
  </div>

  <h1>Programming Fundamentals Quiz</h1>

  <div class="main">
    <section class="left">
      <div class="question-number" id="questionNumber"></div>
      <div class="question" id="question"></div>
      <div class="answers" id="answers"></div>

      <div class="lifelines">
        <button class="lifeline" id="fiftyButton">50/50</button>
        <button class="lifeline" id="friendButton">☎ Call a Friend</button>
        <button class="lifeline" id="audienceButton">👥 Ask the Audience</button>
      </div>

      <div class="message" id="message"></div>
    </section>

    <aside class="money-ladder">
      <h2>Prize Money</h2>
      <div id="ladder"></div>
    </aside>
  </div>
</div>

<div class="overlay" id="startScreen">
  <div class="box">
    <h2>Welcome!</h2>
    <p>
      Test your knowledge of programming fundamentals, data,
      algorithms, testing, hardware and development requirements.
    </p>
    <button class="start-button" id="startButton">Start Game</button>
  </div>
</div>

<div class="overlay hidden" id="gameOver">
  <div class="box">
    <h2 id="gameOverTitle"></h2>
    <p id="gameOverText"></p>
    <button class="restart-button" id="restartButton">Play Again</button>
  </div>
</div>

<script>
const prizes = [

  "£2,000", "£4,000", "£8,000", "£16,000",

      "A condition",

    ],

  },
  {
    q: "What is selection in programming?",
    a: [
      "Repeating code forever",

    ],

  },
  {
    q: "What does iteration mean?",
    a: [
      "Repetition",
      "Deletion",
      "Compilation",
      "Comparison"
    ],
    c: "Repetition"
  },
  {
    q: "What is a for loop commonly used for?",
    a: [
      "A count-controlled loop",
      "Creating a flowchart",
      "Storing text only",
      "Finding syntax errors"
    ],
    c: "A count-controlled loop"
  },
  {
    q: "What is a count-controlled loop?",
    a: [
      "A loop repeated a set number of times",

  {

    a: [
      "A sub-program within a larger program",

      "A number with decimals"
    ],

  },
  {
    q: "What is a parameter?",
    a: [
      "A value passed into a function",
      "A type of loop",

      "A testing document"
    ],
    c: "A value passed into a function"
  },
  {
    q: "What is pseudocode?",
    a: [
      "A textual representation of an algorithm",
      "A computer virus",
      "A type of memory",
      "A programming language compiler"
    ],
    c: "A textual representation of an algorithm"
  },
  {
    q: "What is a flowchart?",
    a: [
      "A visual representation of an algorithm",
      "A list of variables",
      "A type of data",
      "A computer processor"
    ],
    c: "A visual representation of an algorithm"
  },
  {
    q: "What is data?",
    a: [
      "Raw information, values, facts and figures",
      "Only computer code",
      "A programming loop",
      "A flowchart symbol"
    ],
    c: "Raw information, values, facts and figures"
  },
  {
    q: "What is a variable?",
    a: [
      "A named memory location that stores a value",
      "A type of printer",
      "A programming error",
      "A search method"
    ],
    c: "A named memory location that stores a value"
  },
  {
    q: "What is a string?",
    a: [
      "A whole number",
      "A sequence of characters",
      "A computer processor",
      "A flowchart"
    ],
    c: "A sequence of characters"
  },
  {
    q: "Which example is an integer?",
    a: [
      "2.5",
      "\"Hello\"",
      "5",
      "A"
    ],
    c: "5"
  },
  {
    q: "What is a float or real number?",
    a: [
      "A decimal number",
      "A single character",
      "A list of instructions",
      "A logical error"
    ],
    c: "A decimal number"
  },
  {
    q: "What is a character?",
    a: [
      "A single letter, digit or symbol",
      "A collection of arrays",
      "A whole program",
      "A testing method"
    ],
    c: "A single letter, digit or symbol"
  },
  {
    q: "What does casting do?",
    a: [
      "Changes the data type of a variable",
      "Repeats a loop",
      "Draws a flowchart",
      "Searches an array"
    ],
    c: "Changes the data type of a variable"
  },
  {
    q: "What is concatenation?",
    a: [
      "Joining two strings together",
      "Removing a variable",
      "Testing a program",
      "Sorting numbers"
    ],
    c: "Joining two strings together"
  },
  {
    q: "What is an array?",
    a: [
      "A collection of items under one identifier",
      "A type of syntax error",
      "A computer screen",
      "A single instruction"
    ],
    c: "A collection of items under one identifier"
  },
  {
    q: "What is an index?",
    a: [
      "A numerical reference to a data location",
      "A type of processor",
      "A programming language",
      "A test result"
    ],
    c: "A numerical reference to a data location"
  },
  {
    q: "What is a Python list?",
    a: [
      "A data structure that can store multiple changeable items",
      "A flowchart symbol",
      "A computer chip",
      "A type of search"
    ],
    c: "A data structure that can store multiple changeable items"
  },
  {
    q: "What is syntax?",
    a: [
      "The rules of a programming language",
      "A type of hardware",
      "A test plan",
      "A data value"
    ],

  },
  {
    q: "What is a syntax error?",
    a: [
      "An error that prevents code from running",
      "An error in the expected result",
      "A hardware failure",

    ],
    c: "An error that prevents code from running"
  },
  {
    q: "What is a runtime error?",
    a: [
      "An error occurring while the program is running",
      "An error in a flowchart only",

  },

    a: [

  },
  {

    a: [
      "Predicting what happens step by step as an algorithm runs",
      "Drawing a logo",
      "Storing images",
      "Measuring screen brightness"
    ],
    c: "Predicting what happens step by step as an algorithm runs"
  },
  {
    q: "What is normal test data?",
    a: [
      "Correct data that should be accepted",
      "Data outside the allowed range",
      "Data that should be rejected",
      "Random computer code"
    ],
    c: "Correct data that should be accepted"
  },
  {
    q: "What is extreme test data?",
    a: [
      "Acceptable data at the ends of the possible range",
      "Data that is always invalid",
      "A syntax error",
      "A type of search"
    ],
    c: "Acceptable data at the ends of the possible range"
  },
  {
    q: "What is invalid test data?",
    a: [
      "Data that should be rejected",
      "Data at the valid limit",
      "Normal input",
      "A correct output"
    ],
    c: "Data that should be rejected"
  },
  {
    q: "How does a linear search find an item?",
    a: [
      "By checking items from the start to the end",
      "By always checking the middle",
      "By deleting the array",
      "By using a flowchart"
    ],
    c: "By checking items from the start to the end"
  },
  {
    q: "How does a binary search work?",
    a: [
      "It repeatedly splits a sorted array in half",
      "It checks every item from the start",
      "It changes data types",
      "It runs a subroutine"
    ],
    c: "It repeatedly splits a sorted array in half"
  },
  {
    q: "What does a truth table show?",
    a: [
      "Inputs and resulting outputs of a logic circuit",
      "The contents of a variable",
      "A list of test plans",
      "The steps in a loop"
    ],
    c: "Inputs and resulting outputs of a logic circuit"
  },
  {
    q: "What does an accelerometer detect?",
    a: [
      "A change in direction or movement",
      "A syntax error",
      "A string value",
      "A user requirement"
    ],
    c: "A change in direction or movement"
  },
  {
    q: "What is artificial intelligence?",
    a: [
      "Computer systems performing human-like behaviour",
      "A type of array",
      "A normal test",
      "A flowchart symbol"
    ],
    c: "Computer systems performing human-like behaviour"
  },
  {
    q: "What is machine learning?",
    a: [
      "A computer system learning over time",
      "A type of syntax",
      "A method of concatenation",
      "A programming error"
    ],
    c: "A computer system learning over time"
  },
  {
    q: "What is a prototype?",
    a: [

      "A final released product",
      "A type of data",
      "A search algorithm"
    ],
    c: "An initial product used for testing and review"
  },
  {
    q: "What does efficient mean when describing a program?",
    a: [
      "It runs quickly and uses resources effectively",
      "It always contains errors",
      "It contains many variables",
      "It has no user requirements"
    ],
    c: "It runs quickly and uses resources effectively"
  }
];

let gameQuestions = [];
let currentQuestion = 0;
let acceptingAnswer = false;
let usedFifty = false;
let usedFriend = false;
let usedAudience = false;

const questionNumber = document.getElementById("questionNumber");
const questionElement = document.getElementById("question");
const answersElement = document.getElementById("answers");
const messageElement = document.getElementById("message");
const ladderElement = document.getElementById("ladder");

const startScreen = document.getElementById("startScreen");
const gameOver = document.getElementById("gameOver");
const gameOverTitle = document.getElementById("gameOverTitle");
const gameOverText = document.getElementById("gameOverText");

const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");
const fiftyButton = document.getElementById("fiftyButton");
const friendButton = document.getElementById("friendButton");
const audienceButton = document.getElementById("audienceButton");

function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}

function createLadder() {
  ladderElement.innerHTML = "";

  [...prizes].reverse().forEach((prize, reverseIndex) => {
    const index = prizes.length - 1 - reverseIndex;
    const item = document.createElement("div");

    item.className = "prize";
    item.id = "prize-" + index;
    item.textContent = `${index + 1}. ${prize}`;

    if (index === 4 || index === 9) {
      item.classList.add("safe");
    }

    ladderElement.appendChild(item);
  });
}

function startGame() {
  gameQuestions = shuffle(questions).slice(0, 15);
  currentQuestion = 0;
  usedFifty = false;
  usedFriend = false;
  usedAudience = false;

  fiftyButton.disabled = false;
  friendButton.disabled = false;
  audienceButton.disabled = false;

  startScreen.classList.add("hidden");
  gameOver.classList.add("hidden");

  createLadder();
  showQuestion();
}

function showQuestion() {
  const current = gameQuestions[currentQuestion];

  acceptingAnswer = true;
  messageElement.textContent = "";

  questionNumber.textContent =
    `Question ${currentQuestion + 1} of 15 — For ${prizes[currentQuestion]}`;

  questionElement.textContent = current.q;
  answersElement.innerHTML = "";

  shuffle(current.a).forEach(answer => {
    const button = document.createElement("button");

    button.className = "answer";
    button.textContent = answer;
    button.dataset.answer = answer;

    button.onclick = () => chooseAnswer(button, answer);
    answersElement.appendChild(button);
  });

  document.querySelectorAll(".prize").forEach(item => {
    item.classList.remove("current");
  });

  document
    .getElementById("prize-" + currentQuestion)
    .classList.add("current");
}

function chooseAnswer(button, answer) {
  if (!acceptingAnswer) return;

  acceptingAnswer = false;

  const correct = gameQuestions[currentQuestion].c;

  document.querySelectorAll(".answer").forEach(item => {
    item.disabled = true;

    if (item.dataset.answer === correct) {
      item.classList.add("correct");
    }
  });

  if (answer === correct) {
    button.classList.add("correct");
    messageElement.textContent = "Correct!";

    if (currentQuestion === 14) {
      setTimeout(() => {
        endGame(
          "Congratulations!",
          "You answered all 15 questions correctly and won £1,000,000!"
        );
      }, 1200);
    } else {
      currentQuestion++;
      setTimeout(showQuestion, 1200);
    }
  } else {
    button.classList.add("wrong");

    setTimeout(() => {
      endGame(
        "Game Over",
        `That answer was incorrect.<br><br>
        The correct answer was:<br><strong>${correct}</strong><br><br>
        You won ${getWinnings()}.`
      );
    }, 1200);
  }
}

function getWinnings() {
  if (currentQuestion >= 10) return prizes[9];
  if (currentQuestion >= 5) return prizes[4];
  return "£0";
}

function endGame(title, text) {
  gameOverTitle.textContent = title;
  gameOverText.innerHTML = text;
  gameOver.classList.remove("hidden");
}

function useFiftyFifty() {
  if (usedFifty || !acceptingAnswer) return;

  usedFifty = true;
  fiftyButton.disabled = true;

  const correct = gameQuestions[currentQuestion].c;
  const incorrect = [...document.querySelectorAll(".answer")]
    .filter(button => button.dataset.answer !== correct);

  shuffle(incorrect).slice(0, 2).forEach(button => {
    button.disabled = true;
    button.style.visibility = "hidden";
  });

  messageElement.textContent = "Two incorrect answers have been removed.";
}

function useFriend() {
  if (usedFriend || !acceptingAnswer) return;

  usedFriend = true;
  friendButton.disabled = true;

  const current = gameQuestions[currentQuestion];
  const accidentallyWrong = Math.random() < 0.0005;
  let suggestion = current.c;

  if (accidentallyWrong) {
    suggestion = shuffle(
      current.a.filter(answer => answer !== current.c)
    )[0];
  }

  messageElement.textContent =
    `Your friend thinks the answer is: "${suggestion}"`;
}

function useAudience() {
  if (usedAudience || !acceptingAnswer) return;

  usedAudience = true;
  audienceButton.disabled = true;

  const current = gameQuestions[currentQuestion];
  const correctPercentage = Math.floor(Math.random() * 11) + 65;
  const remaining = 100 - correctPercentage;

  const wrongAnswers = current.a.filter(answer => answer !== current.c);
  const first = Math.floor(Math.random() * (remaining + 1));
  const second = Math.floor(Math.random() * (remaining - first + 1));
  const third = remaining - first - second;

  const results = [
    `${current.c}: ${correctPercentage}%`,
    `${wrongAnswers[0]}: ${first}%`,
    `${wrongAnswers[1]}: ${second}%`,
    `${wrongAnswers[2]}: ${third}%`
  ];

  messageElement.textContent =
    "Audience poll: " + shuffle(results).join(" | ");
}

startButton.onclick = startGame;
restartButton.onclick = startGame;
fiftyButton.onclick = useFiftyFifty;
friendButton.onclick = useFriend;
audienceButton.onclick = useAudience;

createLadder();
</script>

</body>
</html>
