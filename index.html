<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who Wants to Be a Millionaire?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #19324d;
      background:
        radial-gradient(circle at top, #263b91, #10152f 65%);
    }

    .game {
      width: min(1000px, 94%);
      margin: 0 auto;
      padding: 20px 0 40px;
      text-align: center;
    }

    h1 {
      margin: 8px 0;
      color: #ffca28;
      text-shadow: 2px 2px #000;
    }

    .subtitle {
      margin: 0 0 15px;
      color: white;
      font-weight: bold;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
      margin: 15px auto;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .definition-card {
      padding: 22px;
      background: rgba(255, 255, 255, 0.97);
      border: 4px solid #ffca28;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .money-ladder {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 18px;
    }

    .money-level {
      padding: 5px 8px;
      border-radius: 6px;
      background: #e5e5e5;
      color: #555;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .money-level.current {
      background: #ffca28;
      color: #173b5d;
      transform: scale(1.1);
    }

    .money-level.completed {
      background: #43a047;
      color: white;
    }

    #definition {
      min-height: 90px;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      line-height: 1.5;
    }

    .lifelines {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0;
    }

    button {
      margin: 5px;
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #286090;
      color: white;
      box-shadow: 0 4px 0 #173b5d;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
    }

    button:hover {
      filter: brightness(1.12);
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #173b5d;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: none;
    }

    .lifelines button {
      background: #6a1b9a;
      box-shadow: 0 4px 0 #421064;
    }

    #resetButton {
      background: #777;
      box-shadow: 0 4px 0 #444;
    }

    .answer-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 25px 0;
    }
